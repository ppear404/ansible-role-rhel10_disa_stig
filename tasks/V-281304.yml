---
- name: V-281304 - Read GRUB defaults
  ansible.builtin.slurp:
    src: /etc/default/grub
  register: rhel10_stig_grub_defaults

- name: V-281304 - Read all kernel boot entries
  ansible.builtin.command: grubby --info=ALL
  register: rhel10_stig_kernel_entries
  changed_when: false
  check_mode: false

- name: V-281304 - Read running kernel arguments
  ansible.builtin.command: cat /proc/cmdline
  register: rhel10_stig_running_args
  changed_when: false
  check_mode: false

- name: V-281304 - Enable page-table isolation
  vars:
    rhel10_stig_grub_lines: >-
      {{ (rhel10_stig_grub_defaults.content | b64decode).splitlines()
         | select('match', '^[ \t]*GRUB_CMDLINE_LINUX=') | list }}
    rhel10_stig_boot_args: >-
      {{ rhel10_stig_kernel_entries.stdout | regex_findall('(?m)^args="(.*)"$') }}
  block:
    - name: V-281304 - Validate boot configuration before editing
      ansible.builtin.assert:
        that:
          - rhel10_stig_boot_args | length > 0
          - rhel10_stig_grub_lines | length <= 1
          - >-
            rhel10_stig_grub_lines | length == 0 or
            rhel10_stig_grub_lines[0] is match('^[ \t]*GRUB_CMDLINE_LINUX=("[^"\n]*"|\x27[^\x27\n]*\x27)[ \t]*$')
        fail_msg: Expected kernel boot entries and at most one quoted GRUB_CMDLINE_LINUX assignment.

    - name: V-281304 - Persist pti setting for future kernels
      vars:
        rhel10_stig_default_args: >-
          {{ (rhel10_stig_grub_lines | first | default('GRUB_CMDLINE_LINUX=""')).split('=', 1)[1].strip()[1:-1] }}
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^[ \t]*GRUB_CMDLINE_LINUX='
        line: >-
          GRUB_CMDLINE_LINUX="{{ (rhel10_stig_default_args.split() | reject('match', '^pti(?:=|$)') | list + ['pti=on']) | join(' ') }}"
        backup: true
      when: >-
        'pti=on' not in rhel10_stig_default_args.split() or
        rhel10_stig_default_args is search('(^| )pti(?:=(?!on(?: |$))[^ ]*)?( |$)')

    - name: V-281304 - Enable page-table isolation in all kernel boot entries
      ansible.builtin.command:
        argv:
          - grubby
          - --update-kernel=ALL
          - --remove-args=pti
          - --args=pti=on
      when: >-
        rhel10_stig_boot_args | reject('search', '(^| )pti=on( |$)') | list | length > 0 or
        rhel10_stig_boot_args | select('search', '(^| )pti(?:=(?!on(?: |$))[^ ]*)?( |$)') | list | length > 0
      changed_when: true

    - name: V-281304 - Reboot to enable page-table isolation
      ansible.builtin.reboot:
        msg: Rebooting to apply V-281304 page-table isolation
        reboot_timeout: 600
      when: >-
        'pti=on' not in rhel10_stig_running_args.stdout.split() or
        rhel10_stig_running_args.stdout is search('(^| )pti(?:=(?!on(?: |$))[^ ]*)?( |$)')
