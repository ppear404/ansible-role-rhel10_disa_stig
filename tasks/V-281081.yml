---
- name: V-281081 | RHEL 10 must define default permissions for the c shell.
  tags:
    - V-281081
  block:
    - name: V-281081 - Correct existing c shell umask settings
      ansible.builtin.replace:
        path: /etc/csh.cshrc
        regexp: '^([ \t]*)umask[ \t]+\S+[^\n]*$'
        replace: '\g<1>umask 077'
        backup: true

    - name: V-281081 - Set an unconditional c shell default umask
      ansible.builtin.blockinfile:
        path: /etc/csh.cshrc
        marker: '# {mark} ANSIBLE MANAGED BLOCK V-281081'
        insertafter: EOF
        block: |
          umask 077
        backup: true
